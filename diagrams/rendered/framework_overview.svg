ous</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="157.7266" x="802.1161" y="324.5877">production, customer, or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="90.2637" x="835.8475" y="339.8983">vendor action.</text></g><!--link Sources to Normalize--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="27" id="lnk8"><path d="M206.04,87.4683 C217.56,87.4683 224.09,87.4683 235.61,87.4683" fill="none" id="Sources-to-Normalize" style="stroke:#4A5568;stroke-width:1.2;"/><polygon fill="#4A5568" points="240.61,87.4683,231.61,83.4683,235.61,87.4683,231.61,91.4683,240.61,87.4683" style="stroke:#4A5568;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Normalize to Reason--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" data-link-type="dependency" data-source-line="28" id="lnk9"><path d="M404.06,87.4683 C415.49,87.4683 421.92,87.4683 433.35,87.4683" fill="none" id="Normalize-to-Reason" style="stroke:#4A5568;stroke-width:1.2;"/><polygon fill="#4A5568" points="438.35,87.4683,429.35,83.4683,433.35,87.4683,429.35,91.4683,438.35,87.4683" style="stroke:#4A5568;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Reason to Challenge--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="29" id="lnk10"><path d="M560.76,87.4683 C572.05,87.4683 578.34,87.4683 589.63,87.4683" fill="none" id="Reason-to-Challenge" style="stroke:#4A5568;stroke-width:1.2;"/><polygon fill="#4A5568" points="594.63,87.4683,585.63,83.4683,589.63,87.4683,585.63,91.4683,594.63,87.4683" style="stroke:#4A5568;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Challenge to Decide--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="30" id="lnk11"><pa