# Evidence Manifest
# Operational Incident Orchestration Framework (OIOF) - synthetic demo repository
#
# This file is the authoritative catalog of evidence for the fictional
# "Intermittent Checkout Authorization Degradation" incident at the fictional
# company Northstar Commerce. Every meaningful claim in prompts/, examples/,
# and docs/ must cite an `id` from this file. scripts/validate_dataset.py and
# tests/test_traceability.py check that every citation resolves to an id here
# and that every id here resolves to real records in dataset/.
#
# Format notes (kept deliberately simple so it can be parsed with the Python
# standard library only - see scripts/_manifest_lite.py):
#   - Top-level key `evidence` is a flat list of records.
#   - Every record is a flat mapping: no nested maps, only scalars and
#     single-line inline lists like [NA, EU, APAC].
#   - Strings that contain a colon are double-quoted.
#
# Reliability ratings:
#   high   - structured, machine-generated, directly queryable
#   medium - human-authored operational record, or self-reported but specific
#   low    - unverified, delayed, sparse/sampled, or informal/assumption-laden

