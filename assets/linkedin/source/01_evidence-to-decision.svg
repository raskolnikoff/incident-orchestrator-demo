<?xml version="1.0" encoding="UTF-8"?>
<!--
  LinkedIn carousel asset 1/3 — "From fragmented evidence to a human decision"

  Preserves the technical meaning of diagrams/source/framework_overview.puml
  and diagrams/source/evidence_to_decision.puml: raw evidence is classified
  into facts / inferences / hypotheses by an LLM synthesis step, which
  recommends to (never decides for) a named human. No autonomous decision
  is depicted or implied anywhere in this file.

  Design system shared across assets/linkedin/source/*.svg:
    Canvas      1600x900 (16:9)
    Ink         #111827 (titles), #374151 (body), #6B7280 (captions/meta)
    Evidence    fill #F3F4F6 / border #D1D5DB (neutral, "unsorted")
    LLM zone    fill #EFF6FF -> #BFDBFE gradient by confidence, border #3B82F6
    Human zone  fill #FFFBEB, border #F59E0B (accountability = amber)
    Divider     #E5E7EB
    Font stack  -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif

  No company branding, no raster/photographic imagery, no AI-generated
  decorative art — every mark below is an authored vector path or shape.
-->
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="From fragmented evidence to a human decision: scattered evidence sources are classified into facts, inferences, and hypotheses, which an LLM recommends to a named human who owns the decision.">
  <title>From fragmented evidence to a human decision</title>

  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrowFaint1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
    <g id="personIcon1">
      <circle cx="0" cy="-26" r="20" />
      <path d="M -38,42 C -38,2 -22,-14 0,-14 C 22,-14 38,2 38,42 Z" />
    </g>
    <g id="checkBadge1">
      <circle cx="0" cy="0" r="19" fill="#F59E0B"/>
      <path d="M -9,0 L -2,8 L 10,-8" fill="none" stroke="#FFFBEB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <style>
    .eyebrow { font: 600 18px/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: 2px; fill: #6B7280; }
    .title   { font: 700 46px/1.15 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
    .zoneLabel { font: 700 20px/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #374151; }
    .cardText { font: 600 19px/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #374151; }
    .barTitle { font: 700 24px/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1E3A8A; }
    .barSub   { font: 500 15px/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #4B5563; }
    .pill     { font: 700 15px/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1D4ED8; letter-spacing: 0.5px; }
    .humanTitle { font: 700 27px/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #78350F; }
    .humanSub   { font: 500 16px/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #92400E; }
    .arrowLabel { font: 600 italic 15px/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #6B7280; }
    .footer   { font: 500 16px/1 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #9CA3AF; }
  </style>

  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="64" y="72" class="eyebrow">OPERATIONAL INCIDENT ORCHESTRATION FRAMEWORK</text>
  <text x="64" y="132" class="title">From fragmented evidence to a human decision</text>
  <line x1="64" y1="172" x2="1536" y2="172" stroke="#E5E7EB" stroke-width="2"/>

  <!-- Zone A label -->
  <text x="64" y="222" class="zoneLabel">Evidence, as it arrives</text>

  <!-- Zone A: scattered evidence cards -->
  <g stroke="#D1D5DB" stroke-width="1.5">
    <g transform="translate(100,290) rotate(-6)">
      <rect x="0" y="0" width="176" height="64" rx="10" fill="#F9FAFB"/>
      <rect x="0" y="0" width="176" height="6" rx="3" fill="#9CA3AF"/>
      <text x="20" y="40" class="cardText">Logs</text>
    </g>
    <g transform="translate(232,254) rotate(5)">
      <rect x="0" y="0" width="176" height="64" rx="10" fill="#F9FAFB"/>
      <rect x="0" y="0" width="176" height="6" rx="3" fill="#9CA3AF"/>
      <text x="20" y="40" class="cardText">Metrics</text>
    </g>
    <g transform="translate(84,418) rotate(3)">
      <rect x="0" y="0" width="176" height="64" rx="10" fill="#F9FAFB"/>
      <rect x="0" y="0" width="176" height="6" rx="3" fill="#9CA3AF"/>
      <text x="20" y="40" class="cardText">Reports</text>
    </g>
    <g transform="translate(248,516) rotate(-5)">
      <rect x="0" y="0" width="176" height="64" rx="10" fill="#F9FAFB"/>
      <rect x="0" y="0" width="176" height="6" rx="3" fill="#9CA3AF"/>
      <text x="20" y="40" class="cardText">Messages</text>
    </g>
    <g transform="translate(120,646) rotate(6)">
      <rect x="0" y="0" width="216" height="64" rx="10" fill="#F9FAFB"/>
      <rect x="0" y="0" width="216" height="6" rx="3" fill="#9CA3AF"/>
      <text x="20" y="40" class="cardText">Change records</text>
    </g>
  </g>

  <!-- Converging connector lines (evidence -> synthesis) -->
  <g stroke="#9CA3AF" stroke-width="2" fill="none" opacity="0.65">
    <path d="M 276,322 C 420,330 480,420 556,486" marker-end="url(#arrowFaint1)"/>
    <path d="M 408,286 C 470,330 500,420 556,478" marker-end="url(#arrowFaint1)"/>
    <path d="M 260,450 C 400,470 480,480 556,494" marker-end="url(#arrowFaint1)"/>
    <path d="M 424,548 C 480,530 510,510 556,502" marker-end="url(#arrowFaint1)"/>
    <path d="M 336,678 C 440,620 500,550 556,510" marker-end="url(#arrowFaint1)"/>
  </g>

  <!-- Zone B label -->
  <text x="560" y="222" class="zoneLabel">Classified, evidence-linked</text>

  <!-- Zone B: synthesis container -->
  <rect x="560" y="260" width="480" height="480" rx="18" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <rect x="592" y="286" width="164" height="34" rx="17" fill="#DBEAFE"/>
  <text x="674" y="308" text-anchor="middle" class="pill">LLM SYNTHESIZES</text>
  <text x="592" y="344" class="barSub">Recommends only. Never decides.</text>

  <g>
    <rect x="592" y="368" width="416" height="92" rx="12" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="616" y="406" class="barTitle">Facts</text>
    <text x="616" y="432" class="barSub">Directly confirmed by evidence</text>
  </g>
  <g>
    <rect x="592" y="474" width="416" height="92" rx="12" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5"/>
    <text x="616" y="512" class="barTitle" fill="#1E40AF">Inferences</text>
    <text x="616" y="538" class="barSub">Reasoned from evidence</text>
  </g>
  <g>
    <rect x="592" y="580" width="416" height="92" rx="12" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="616" y="618" class="barTitle" fill="#1E40AF">Hypotheses</text>
    <text x="616" y="644" class="barSub">Competing, not yet resolved</text>
  </g>

  <!-- Arrow: synthesis -> human -->
  <line x1="1040" y1="500" x2="1119" y2="500" stroke="#374151" stroke-width="3" marker-end="url(#arrow1)"/>
  <text x="1080" y="465" text-anchor="middle" class="arrowLabel">recommends</text>

  <!-- Zone C label -->
  <text x="1132" y="222" class="zoneLabel">Owned, by name</text>

  <!-- Zone C: human decision -->
  <rect x="1132" y="260" width="404" height="480" rx="18" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
  <g transform="translate(1334,400)" fill="#92400E">
    <use href="#personIcon1"/>
  </g>
  <g transform="translate(1388,446)">
    <use href="#checkBadge1"/>
  </g>
  <text x="1334" y="492" text-anchor="middle" class="humanTitle">Human decision</text>
  <text x="1334" y="526" text-anchor="middle" class="humanSub">Approves · Owns · Accountable</text>

  <!-- Footer -->
  <line x1="64" y1="800" x2="1536" y2="800" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="64" y="836" class="footer">Illustrative framework diagram · synthetic example, not a real incident</text>
  <text x="1536" y="836" text-anchor="end" class="footer">1 / 3</text>
</svg>
