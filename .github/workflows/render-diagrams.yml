name: Verify Generated Assets

# This workflow never commits or pushes. It regenerates
# diagrams/rendered/ from its source in a clean checkout and fails if
# that regeneration produces any diff, which means the version
# committed to the branch is stale. Contributors fix staleness locally
# with `make diagrams` and commit the result themselves — see
# CONTRIBUTING.md.

on:
  push:
    branches: [main]
    paths:
      - "diagrams/source/**"
      - "diagrams/rendered/**"
      - "scripts/render_diagrams.sh"
  pull_request:
    branches: [main]
    paths:
      - "diagrams/source/**"
      - "diagrams/rendered/**"
      - "scripts/render_diagrams.sh"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PlantUML
        run: sudo apt-get update && sudo apt-get install -y plantuml

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Render diagrams from source
        run: bash scripts/render_diagrams.sh

      - name: Fail if generated assets are stale
        run: |
          if ! git diff --exit-code -- diagrams/rendered; then
            echo "::error::diagrams/rendered/ does not match its source."
            echo "Run 'make diagrams' locally, then commit the result."
            exit 1
          fi

      - name: Upload rendered assets as a build artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-assets
          path: |
            diagrams/rendered/
